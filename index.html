<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System 3D Visualization - Laptop Node Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Outfit:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo_eb.png">

  <!-- Three.js and Addons via Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Overlay UI -->
  <div class="dashboard-ui">

    <!-- Floating Back Button (Shown when zoomed in) -->
    <button id="btn-back" class="btn btn-accent floating-back-btn hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      QUAY LẠI TỔNG QUAN
    </button>

  </div>

  <!-- Main scripts -->
  <script type="module" src="app.js"></script>
</body>

</html>
