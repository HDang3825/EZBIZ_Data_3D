<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System 3D Visualization - Laptop Node Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Outfit:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo_eb.png">

  <!-- Three.js and Addons via Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Overlay UI -->
  <div class="dashboard-ui">

    <!-- Right Panel: Controls & Actions -->
    <section class="panel-right glass-card">
      <h2>OPERATIONS</h2>
      <div class="control-buttons">
        <button id="btn-zoom-screen" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
          </svg>
          Zoom Into Screen
        </button>
        <button id="btn-reset-view" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg>
          Reset Camera
        </button>
      </div>

      <div class="divider"></div>

      <h2>INTERACTION INFO</h2>
      <p class="info-text">
        <span class="glow-text">💡 Hướng dẫn:</span> Bạn có thể kéo chuột để xoay laptop trong không gian. Click trực
        tiếp vào màn hình laptop để <strong>Zoom vào hệ thống con</strong> bên trong.
      </p>

      <!-- Back button shown when zoomed in -->
      <button id="btn-back" class="btn btn-accent hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        QUAY LẠI TỔNG QUAN
      </button>
    </section>

  </div>

  <!-- Main scripts -->
  <script type="module" src="app.js"></script>
</body>

</html>
